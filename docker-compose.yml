services:
  mysql:
    image: mysql:8.0
    container_name: patent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: patent_valuation
      MYSQL_USER: patent
      MYSQL_PASSWORD: patent_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: patent-valuation-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: patent
      MYSQL_PASSWORD: patent_dev
      MYSQL_DATABASE: patent_valuation
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
    volumes:
      - ./reports:/app/reports
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
